<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyes of Fire Series</title>
    <meta name="description" content="An epic dark sci-fi and historical fantasy crossover series.">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <script type="application/ld+json" id="schema-container"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="#/" class="logo">Eyes of Fire</a>
            <nav class="header-nav">
                <select id="jump-to-book">
                    <option value="">Jump to Book...</option>
                </select>
                <button id="audio-toggle" class="audio-toggle-btn">🎵 Soundtrack</button>
                <a href="#" id="author-link" target="_blank" rel="noopener noreferrer">Author Website</a>
            </nav>
        </div>
    </header>

    <main id="app-root"></main>

    <aside id="audio-dock" class="audio-dock hidden">
        <div class="audio-header">
            <span class="audio-title">Atmospheric Soundtrack</span>
            <button id="close-audio" class="close-audio-btn">&times;</button>
        </div>
        <div class="audio-visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div id="spotify-player-container"></div>
    </aside>

    <div id="retailer-modal" class="modal hidden">
        <div class="modal-content glassmorphism">
            <span class="close-modal">&times;</span>
            <h2>Get the Book</h2>
            <div id="retailer-links" class="retailer-grid"></div>
        </div>
    </div>

    <script src="assets/js/audio.js"></script>
    <script src="assets/js/schema.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/router.js"></script>
</body>
</html>
